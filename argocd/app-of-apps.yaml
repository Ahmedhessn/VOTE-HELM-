apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-app-app-of-apps
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ahmedhessn/VOTE-APP-V-3
    targetRevision: main
    path: vote-app-chart/argocd
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true

