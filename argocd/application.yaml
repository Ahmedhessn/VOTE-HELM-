apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vote-app
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Ahmedhessn/VOTE-APP-V-3
    targetRevision: main
    path: vote-app-chart
    helm:
      valueFiles:
        - values.yaml
      parameters:
        - name: postgres.image.repository
          value: "01061875164/postgres15-alpine"
        - name: postgres.image.tag
          value: "v3"
        - name: redis.image.repository
          value: "01061875164/redis"
        - name: redis.image.tag
          value: "v1"
        - name: vote.image.repository
          value: "01061875164/vote-app"
        - name: vote.image.tag
          value: "v1"
        - name: result.image.repository
          value: "01061875164/result"
        - name: result.image.tag
          value: "v3"
        - name: worker.image.repository
          value: "01061875164/worker"
        - name: worker.image.tag
          value: "v2"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

