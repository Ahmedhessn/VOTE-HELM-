{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: db
    chart: {{ include "vote-app.chart" . }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
spec:
  selector:
    app: db
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
{{- end }}

